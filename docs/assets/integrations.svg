<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Two integrations. OmniRoute is found on localhost and its whole catalogue is imported in one step. Composio gives an agent real connected accounts, scoped so each agent reaches only the apps it was given.">
  <title>OmniRoute and Composio, and what CHIMERA does with them</title>
  <style>
    .bg { fill: #0d0d0c; }
    .card { fill: #161614; stroke: #2a2825; stroke-width: 1; }
    .omni { fill: #10201f; stroke: #5ac8c8; stroke-width: 1.3; }
    .comp { fill: #17142a; stroke: #6c47ff; stroke-width: 1.3; }
    .hh { font: 500 14px ui-sans-serif, system-ui, sans-serif; fill: #f5f3ee; }
    .h  { font: 500 12.5px ui-sans-serif, system-ui, sans-serif; fill: #f5f3ee; }
    .s  { font: 400 10.5px ui-sans-serif, system-ui, sans-serif; fill: #a3a09a; }
    .t  { font: 400 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6f6c66; }
    .wire { stroke: #2f2c29; stroke-width: 1.3; fill: none; }

    .pulseA { stroke: #5ac8c8; stroke-width: 1.8; fill: none; stroke-linecap: round;
              stroke-dasharray: 6 200; animation: runA 3s linear infinite; }
    @keyframes runA { from { stroke-dashoffset: 206 } to { stroke-dashoffset: 0 } }

    .pulseB { stroke: #6c47ff; stroke-width: 1.8; fill: none; stroke-linecap: round;
              stroke-dasharray: 6 150; animation: runB 3s linear infinite; }
    @keyframes runB { from { stroke-dashoffset: 156 } to { stroke-dashoffset: 0 } }

    .blocked { stroke: #d4614a; stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; }

    @media (prefers-reduced-motion: reduce) { .pulseA, .pulseB { animation: none; opacity: .5 } }
  </style>

  <rect class="bg" width="880" height="360" rx="10"/>

  <!-- ── OmniRoute ─────────────────────────────────────────────── -->
  <text class="hh" x="28" y="34">OmniRoute — one connection, a whole catalogue</text>

  <rect class="card" x="28" y="52" width="128" height="52" rx="8"/>
  <text class="h" x="44" y="74">CHIMERA</text>
  <text class="t" x="44" y="90">looks on localhost</text>

  <path class="wire" d="M156 78 H244"/>
  <path class="pulseA" d="M156 78 H244"/>
  <text class="t" x="168" y="70">:20128</text>

  <rect class="omni" x="244" y="46" width="150" height="64" rx="9"/>
  <circle cx="264" cy="70" r="6" fill="#5ac8c8"/>
  <text class="h" x="280" y="74" fill="#9fe0e0">OmniRoute</text>
  <text class="t" x="260" y="94">on your machine</text>

  <path class="wire" d="M394 78 H470"/>
  <path class="pulseA" d="M394 78 H470"/>

  <g>
    <rect class="card" x="470" y="46" width="382" height="64" rx="9"/>
    <text class="s" x="486" y="70">Its entire model catalogue, imported as one connection —</text>
    <text class="s" x="486" y="88">prices, context windows and health, without a restart.</text>
  </g>

  <text class="t" x="28" y="130">Detected automatically. Not installed is a normal answer, and gets install guidance rather than an error.</text>

  <!-- ── Composio ──────────────────────────────────────────────── -->
  <text class="hh" x="28" y="184">Composio — real accounts, scoped per agent</text>

  <rect class="card" x="28" y="202" width="150" height="52" rx="8"/>
  <text class="h" x="44" y="224">App operator</text>
  <text class="t" x="44" y="240">one agent, one grant</text>

  <path class="wire" d="M178 228 H266"/>
  <path class="pulseB" d="M178 228 H266"/>

  <rect class="comp" x="266" y="196" width="150" height="64" rx="9"/>
  <circle cx="286" cy="220" r="6" fill="#6c47ff"/>
  <text class="h" x="302" y="224" fill="#b9a8ff">Composio</text>
  <text class="t" x="282" y="244">OAuth, refresh, lifecycle</text>

  <path class="wire" d="M416 228 H492"/>
  <path class="pulseB" d="M416 228 H492"/>

  <g>
    <rect class="card" x="492" y="196" width="118" height="30" rx="7"/>
    <circle cx="508" cy="211" r="4" fill="#ea4335"/>
    <text class="s" x="520" y="215">Gmail</text>

    <rect class="card" x="492" y="230" width="118" height="30" rx="7"/>
    <circle cx="508" cy="245" r="4" fill="#4a154b"/>
    <text class="s" x="520" y="249">Slack</text>

    <rect class="card" x="626" y="196" width="118" height="30" rx="7" stroke="#3a3733"/>
    <circle cx="642" cy="211" r="4" fill="#3f3d3a"/>
    <text class="s" x="654" y="215" fill="#6f6c66">Calendar</text>
    <path class="blocked" d="M626 211 H610"/>

    <rect class="card" x="626" y="230" width="118" height="30" rx="7" stroke="#3a3733"/>
    <circle cx="642" cy="245" r="4" fill="#3f3d3a"/>
    <text class="s" x="654" y="249" fill="#6f6c66">Drive</text>
    <path class="blocked" d="M626 245 H610"/>
  </g>

  <!-- Column headings, not row ones: these label the two groups of apps, and
       beside the rows they read as labelling Gmail and Slack differently. -->
  <text class="t" x="492" y="188" fill="#5aa76f">granted to this agent</text>
  <text class="t" x="626" y="188" fill="#d4614a">not granted</text>

  <text class="t" x="28" y="288">A mailbox agent cannot reach your calendar, because it was never given it. Scope is enforced on this side rather than</text>
  <text class="t" x="28" y="304">asked for politely: the upstream toolkit filter is a ranking hint, and a hint is not a boundary.</text>

  <text class="s" x="28" y="336">Both are optional. CHIMERA works with neither, and neither replaces the other — one brings models, the other brings the apps you already use.</text>
</svg>
