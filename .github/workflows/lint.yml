name: Lint, typecheck, test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run check:layout

      - run: npm run check:no-raw-sql

      # The install scripts are the first thing a user runs and are exercised
      # by nothing else here. PowerShell Core is preinstalled on this runner,
      # so both get parsed for the price of the Linux leg.
      - run: npm run check:installers

      - run: npm run check:design-tokens
      - run: npm run check:css-collisions
      - run: npm run check:contrast
      # `stats/` is deployed by wrangler and built by nothing here, which is not
      # a reason to let it rot.
      - run: npm run typecheck:stats
      - run: npm run test:stats

      - run: npm run check:boundaries

      - run: npm run check:no-global-hotkey

      - run: npm run docs:check-links

      - run: npm run lint

      - run: npm run format

      - run: npm run typecheck

      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: sudo apt-get update && sudo apt-get install -y xvfb

      # Electron needs a real (if virtual) display server on Linux even
      # sandboxed and headless — there is no true headless mode for a
      # BrowserWindow the way there is for a headless browser.
      - run: xvfb-run --auto-servernum npm run test:e2e --workspace apps/desktop

      # What Playwright saw when it failed.
      #
      # A CI failure that reproduces on no local machine is only debuggable
      # from the artefacts, and the log carries the assertion without the page:
      # fifty-four tests failed on `omniroute-setup` never leaving "detected",
      # and the message explaining why was on screen and nowhere in the log.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
