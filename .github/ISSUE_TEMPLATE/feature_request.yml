name: Feature request
description: Something CHIMERA should be able to do and cannot
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        The job, rather than the feature. "I need to pull invoice totals out of
        a shared folder every morning" is more useful than "add a folder
        watcher" — the second may not be the best answer to the first.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How are you doing it today?
      description: Including "by hand", which is a perfectly good answer.

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: If you have a shape in mind for it. Optional.
